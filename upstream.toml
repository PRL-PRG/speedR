# The benchmark suite speedR runs, pinned to one commit.
#
# bench, the benchmarking library underneath, is not pinned here: speedR's
# drivers run in r-benchmarks' own environment (`uv run --project`), so bench
# is whatever r-benchmarks' uv.lock locks at this commit, and the two cannot
# drift apart. `speedr fetch-suite` checks the commit out and reports both.
#
# 954f09e is the head of the `modularize` branch (PRL-PRG/r-benchmarks#4);
# move to the merge commit on main once that is merged.

[r-benchmarks]
repo = "https://github.com/PRL-PRG/r-benchmarks.git"
commit = "954f09e87f84bc29a9fefb1a319120403b1f496a"
