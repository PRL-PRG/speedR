[project]
name = "speedr"
version = "0.1.0.dev0"
description = "Benchmark GNU R across releases, nightly builds, configurations and platforms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22"]

[project.scripts]
speedr = "speedr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speedr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
