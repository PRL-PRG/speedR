[project]
name = "speedr"
version = "0.1.0.dev0"
description = "Benchmark GNU R across releases, nightly builds, configurations and platforms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22", "rbench"]

# The benchmark suite, its harnesses and drivers, pinned to one commit. bench,
# the benchmarking library underneath, comes with it: rbench pins its commit,
# and uv.lock records both.
#
# 65ca9a3 is the head of r-benchmarks' `modularize` branch
# (PRL-PRG/r-benchmarks#4); move to the merge commit on main once it is merged.
[tool.uv.sources]
rbench = { git = "https://github.com/PRL-PRG/r-benchmarks.git", rev = "65ca9a3dda1e35b6d550d97c71c086b479c8cfde" }

[project.scripts]
speedr = "speedr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speedr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
