[project]
name = "speedr"
version = "0.1.0.dev0"
description = "Benchmark GNU R across releases, nightly builds, configurations and platforms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22", "rbench"]

# The benchmark suite, its harnesses and drivers, pinned to one commit. bench,
# the benchmarking library underneath, comes with it: rbench pins its commit,
# and uv.lock records both.
[tool.uv.sources]
rbench = { git = "https://github.com/PRL-PRG/r-benchmarks.git", rev = "cf04f706a745b0e8679628aacb6b4df8e3345650" }

# bench with Thermal (PRL-PRG/bench#3, from the fork) until r-benchmarks pins a
# bench that has it
[tool.uv]
override-dependencies = ["bench @ git+https://github.com/MatejKocourek/bench.git@139ab198a8b663aeef09531fa29f906053a86173"]

[project.scripts]
speedr = "speedr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speedr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
