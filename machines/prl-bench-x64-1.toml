# The reference machine: dedicated Linux x86-64 box (see docs/machines.md for
# its host setup). Values marked TBD are filled in when the box is installed.
name = "prl-bench-x64-1"
os = "linux"
arch = "x86_64"
cpu = "TBD"
cores = "TBD"                 # isolated cores the benchmarks are pinned to
runtime = "docker"
profiler = "perf"
profiles = "validated"        # perf on x86-64 is the method VMIL'26 validated
track_devel = true
# wol until we know whether the scheduler shares its L2 segment; switch to
# ipmi if the board has a BMC, or relay via a host on its subnet.
wake = "wol"
wake_secret = "WAKE_PRL_BENCH_X64_1"
