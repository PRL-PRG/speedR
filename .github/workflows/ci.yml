# Checks for every push and pull request. Everything here runs on
# GitHub-hosted runners: nothing in this workflow may target the self-hosted
# benchmark machines or the scheduler (tests/test_workflows.py enforces it).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Registry and configs load
        run: |
          uv run speedr machines
          uv run speedr configs

  suite:
    name: Drivers and categorize (pinned r-benchmarks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::dplyr, any::tidyr, any::readr, any::stringr, any::tibble
      - run: uv sync --locked
      - name: Fetch the pinned suite
        run: uv run speedr fetch-suite "$RUNNER_TEMP/r-benchmarks"
      - name: Timing driver, two benchmarks
        env:
          RBENCH_ROOT: ${{ runner.temp }}/r-benchmarks
        run: |
          uv run --project "$RBENCH_ROOT" python drivers/timing.py \
            --include '^areWeFast/(bounce|mandelbrot)$' --runs 1 --iterations 2 \
            --library-path "$RUNNER_TEMP/rlib" --no-progress --json "$RUNNER_TEMP/timing.json"
          python3 -c "import json, sys; e = json.load(open(sys.argv[1]))['executions']; \
            bad = [x['benchmark'] for x in e if x['failure']]; \
            sys.exit(f'failed: {bad}' if bad or len(e) != 2 else 0)" "$RUNNER_TEMP/timing.json"
      - name: Profile driver, dry run (no perf on hosted runners)
        env:
          RBENCH_ROOT: ${{ runner.temp }}/r-benchmarks
        run: |
          uv run --project "$RBENCH_ROOT" python drivers/profile.py --dry \
            --include '^areWeFast/bounce$' --library-path "$RUNNER_TEMP/rlib" --dir "$RUNNER_TEMP/perf"
      - name: categorize.R on the synthetic recording
        run: uv run pytest tests/test_profile.py -v

  site:
    name: Dashboard (render with mock data)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: site
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
      - name: Render
        working-directory: site
        run: quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/_site
          retention-days: 7
